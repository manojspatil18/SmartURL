# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8080

# ===================================================================
# DATABASE CONFIGURATION (In-Memory H2 Fallback - ACTIVE BY DEFAULT)
# ===================================================================
# This configuration runs a fast in-memory database out-of-the-box.
# It requires ZERO installation or setup, allowing you to run the website instantly!
spring.datasource.url=jdbc:h2:mem:smart_url_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# DATABASE CONFIGURATION (MySQL - Alternative)
# ===================================================================
# To switch to MySQL:
# 1. Create the database in MySQL: "CREATE DATABASE smart_url_db;"
# 2. Uncomment the 5 lines below (remove the leading "#").
# 3. Comment out the 5 H2 database configuration lines above (add a leading "#").
#
# spring.datasource.url=jdbc:mysql://localhost:3306/smart_url_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================================================================
# JPA / HIBERNATE LOGGING CONFIGURATION
# ===================================================================
# Set to true to view SQL logs in the terminal console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# THYMELEAF CONFIGURATION
# ===================================================================
# Enable template caching for production. Set to false for development so template changes apply instantly.
spring.thymeleaf.cache=false
